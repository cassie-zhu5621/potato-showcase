<text x="110" y="604" font-family="'Klee One','Klee','Hiragino Maru Gothic ProN','Noto Sans CJK JP',sans-serif" font-size="26" fill="#555" text-anchor="start">→ ふりかえすよ</text>
<text x="110" y="636" font-family="'Chalkboard SE','Marker Felt','Comic Sans MS','Noto Sans',sans-serif" font-size="22" fill="#555" text-anchor="start">I'll wave back</text>
