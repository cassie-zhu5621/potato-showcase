<text x="130" y="334" font-family="'Klee One','Klee','Hiragino Maru Gothic ProN','Noto Sans CJK JP',sans-serif" font-size="26" fill="#555" text-anchor="start">→ おきて、すりすりするよ</text>
<text x="130" y="366" font-family="'Chalkboard SE','Marker Felt','Comic Sans MS','Noto Sans',sans-serif" font-size="22" fill="#555" text-anchor="start">I wake up and nuzzle your hand</text>
